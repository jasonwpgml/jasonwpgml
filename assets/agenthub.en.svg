<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1208 478" role="img" aria-labelledby="title">
  <title id="title">AgentHub architecture. Claude Code, Codex, Cursor and Grok CLI connect to AgentHub over MCP. AgentHub reaches the MacBook, the Samsung laptop and the desktop through Git sync and SSH job dispatch.</title>
