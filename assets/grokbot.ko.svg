<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1208 448" role="img" aria-labelledby="title">
  <title id="title">그록봇 연결도. 코딩 에이전트의 할 일 등록과 AgentHub 알림이 웹훅으로 그록봇 클라우드 루틴에 들어가고, 그록봇은 할 일 목록, 마감 알림, 아침 브리핑을 내보낸다. 작업 위임은 MCP로 보내고 결과를 회수한다.</title>
