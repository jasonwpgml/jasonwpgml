<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1208 488" role="img" aria-labelledby="title">
  <title id="title">How AND changed. A 401-page Markdown LLM wiki became a single SQLite source in October 2026. Verified claims and evidence are extracted from raw records, indexed for unified search and served through an MCP server. The wiki remains as a derived view.</title>
