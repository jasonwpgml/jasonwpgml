    .code { font: 600 14.5px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .h { font-weight: 700; font-size: 25px; }
    .num { font-weight: 700; font-size: 28px; fill: #bc8cff; }
    .b { fill: #161b22; stroke: #3d444d; stroke-width: 1.2; }
    .b.hub { fill: #bc8cff; fill-opacity: .1; stroke: #bc8cff; stroke-opacity: .6; }
    .b.dash { stroke-dasharray: 5 5; }
    .b.pg { fill: #0d1117; }
    .ln { fill: none; stroke: #9ea7b3; stroke-width: 1.4; }
    .ln.a { stroke: #bc8cff; stroke-width: 2.2; }
    .ln.d { stroke-dasharray: 5 5; }
    .ln.thin { stroke-width: 1; opacity: .6; }
