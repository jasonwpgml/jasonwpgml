<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1208 448" role="img" aria-labelledby="title">
  <title id="title">Grok bot connections. To-dos from coding agents and AgentHub notices enter the Grok bot cloud routine through a webhook. The bot produces a to-do list, deadline reminders and a morning briefing. Delegated jobs go out over MCP and their results come back.</title>
